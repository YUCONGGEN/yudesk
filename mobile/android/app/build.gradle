plugins { id 'com.android.application' }

def thirdPartyAssets = layout.buildDirectory.dir('generated/third-party-assets')
tasks.register('copyThirdPartyNotices', Copy) {
    from(rootProject.file('../../third_party/anet')) {
        include 'LICENSE', 'LICENSE-GO', 'README.yudesk.md'
        into 'licenses/anet'
    }
    from(rootProject.file('../../third_party/THIRD_PARTY_NOTICES.txt')) {
        into 'licenses'
    }
    into thirdPartyAssets
}

android {
    namespace 'cn.yucg.yudesk'
    compileSdk 35
    ndkVersion '27.3.13750724'
    defaultConfig {
        applicationId 'cn.yucg.yudesk.preview'
        minSdk 26
        targetSdk 35
        versionCode 2000012
        versionName '2.0.0-preview.12'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { applicationIdSuffix ''; debuggable true }
        release { minifyEnabled false }
    }
    lint { abortOnError true; checkReleaseBuilds true }
    // A universal APK carries four gomobile ABIs. Compress the native entries
    // for reliable direct HTTP downloads; Android extracts them before load.
    // The ELF LOAD segments remain 16 KiB aligned for newer devices.
    packaging { jniLibs { useLegacyPackaging = true } }
    sourceSets.main.assets.srcDir thirdPartyAssets
}
tasks.named('preBuild') { dependsOn 'copyThirdPartyNotices' }
dependencies {
    implementation files('libs/yudesk-core.aar')
    // CI resolves the pinned Maven artifact. A developer may place the same
    // verified AAR here when an isolated/offline Gradle runner is used.
    def localWebrtc = file('libs/webrtc-local.aar')
    implementation(localWebrtc.exists() ? files(localWebrtc) : 'io.github.webrtc-sdk:android:150.7871.01')
    testImplementation 'junit:junit:4.13.2'
}
