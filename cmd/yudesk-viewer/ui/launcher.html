<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YuDesk 控制端</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eaf2ff;font:15px/1.6 system-ui}.wrap{max-width:720px;margin:35px auto;padding:20px}.card{background:#101d2d;border:1px solid #28405d;border-radius:18px;padding:28px}h1{margin:0;font-size:32px}.sub,.hint{color:#8ea4bf}label{display:block;margin-top:14px}input,button{width:100%;padding:12px;border-radius:9px;border:1px solid #35506f;background:#07111f;color:#fff;font-size:16px}input{font-family:ui-monospace}button{margin-top:16px;background:#2878e8;font-weight:600;cursor:pointer}.danger{background:#a43b49}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.choice,.audio{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid #35506f;border-radius:9px;background:#0b1725;margin:0}.choice input,.audio input{width:auto;margin-top:4px}.choice span,.audio span{display:block}.choice small,.audio small{display:block;color:#8ea4bf}.audio{margin-top:10px}.history{margin-top:26px}.record{padding:14px 0;border-bottom:1px solid #28405d;display:flex;gap:12px;align-items:center}.record div{min-width:0;flex:1}.record small{display:block;color:#8ea4bf;overflow-wrap:anywhere}.record a{color:#80c0ff}.record form{margin:0}.record button{font-size:13px;width:auto;padding:6px 10px;margin:0;background:#20364f}.message{color:#ffd98a}@media(max-width:600px){.wrap{margin-top:0;padding:12px}.card{padding:18px}.choices{grid-template-columns:1fr}}</style></head>
<body data-token="{{.Token}}"><main class="wrap"><section class="card"><h1>YuDesk 控制端</h1><p class="sub">输入对方被控端显示的设备码和 PIN。</p>
{{if .Message}}<p class="message">{{.Message}}</p>{{end}}
<form method="post" action="/connect?access_token={{.Token}}"><label>设备码</label><input name="device_id" maxlength="24" value="{{.DeviceID}}" placeholder="24 位设备码" autocomplete="off" required><label>PIN</label><input name="pin" type="password" minlength="6" maxlength="8" inputmode="numeric" placeholder="对方的 PIN" autocomplete="off" required><div class="choices"><label class="choice"><input type="radio" name="mode" value="control" checked><span><strong>控制</strong><small>观看并操作鼠标、键盘</small></span></label><label class="choice"><input type="radio" name="mode" value="view"><span><strong>仅观看</strong><small>不向远端发送任何控制输入</small></span></label></div><label class="audio"><input type="checkbox" name="audio" value="1"><span><strong>听取被控端声音</strong><small>Windows 使用系统声音；Linux 需要 PulseAudio。进入桌面后点击一次“播放声音”。</small></span></label><button>连接远程电脑</button></form>
<section class="history"><h2>最近连接</h2><p class="hint">保存最近 30 台成功连接的设备。点击“再次连接”填入设备码；PIN 不保存。</p>
{{range .History}}<article class="record"><div><strong>{{.Name}}</strong><small>{{.DeviceID}}</small><small>上次连接：{{.LastConnected.Local.Format "2006-01-02 15:04"}}</small></div><a href="/?access_token={{$.Token}}&amp;device_id={{.DeviceID}}">再次连接</a><form method="post" action="/history/delete?access_token={{$.Token}}"><input type="hidden" name="device_id" value="{{.DeviceID}}"><button type="submit">移除</button></form></article>{{else}}<p class="hint">暂无连接记录。</p>{{end}}</section>
<form method="post" action="/exit?access_token={{.Token}}" onsubmit="return confirm('确定要退出 YuDesk 控制端吗？')"><button class="danger" type="submit">退出控制端</button></form><p class="hint">关闭本窗口会自动结束控制端进程；需要再次使用时，重新双击控制端程序。</p></section></main><script>const token=document.body.dataset.token;fetch('/api/ui/watch?access_token='+encodeURIComponent(token)).catch(()=>{});</script></body></html>
