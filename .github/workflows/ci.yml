name: go-ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
          - os: windows-latest
            goos: windows
          - os: macos-latest
            goos: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - run: go test ./...
      - run: go vet ./...
      - name: Android interface compatibility regression
        if: runner.os == 'Linux'
        working-directory: third_party/anet
        run: |
          go test -race ./...
          go test -race interface_android.go netlink_android.go android_api_level.go zone.go zone_test.go interface_android_test.go netlink_android_test.go
      - run: node --test scripts/input.test.cjs scripts/frames.test.cjs scripts/presence.test.cjs scripts/audio.test.cjs scripts/files.test.cjs
      - run: go build ./cmd/yudesk ./cmd/yudesk-agent ./cmd/yudesk-viewer ./cmd/yudesk-relay ./cmd/yudesk-account ./cmd/yudesk-admin ./cmd/yudesk-update ./cmd/yudesk-sign
